# render.yaml — Deploy RehabAI backend to Render.com (free tier)
# This file tells Render EXACTLY what to do — no guessing
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: rehabai-backend
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: ALLOWED_ORIGINS
        value: https://saiimmani.github.io,http://localhost:3000
